<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Coke Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide React icons as inline SVG components
        const PlusCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
        );

        const Calendar = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        );

        const Award = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="8" r="7"></circle>
                <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
            </svg>
        );

        const Trash2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        function DietCokeTracker() {
            const [entries, setEntries] = useState([]);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('today');
            const [showForm, setShowForm] = useState(false);
            const [formData, setFormData] = useState({
                date: new Date().toISOString().slice(0, 10),
                location: '',
                ounces: '',
                price: '',
                type: 'can'
            });

            useEffect(() => {
                loadEntries();
            }, []);

            const loadEntries = async () => {
                try {
                    const stored = localStorage.getItem('diet-coke-entries');
                    if (stored) {
                        setEntries(JSON.parse(stored));
                    }
                } catch (error) {
                    console.log('No existing entries found');
                } finally {
                    setLoading(false);
                }
            };

            const saveEntries = async (newEntries) => {
                try {
                    localStorage.setItem('diet-coke-entries', JSON.stringify(newEntries));
                    setEntries(newEntries);
                } catch (error) {
                    console.error('Failed to save:', error);
                }
            };

            const openForm = () => {
                setFormData({
                    date: new Date().toISOString().slice(0, 10),
                    location: '',
                    ounces: '',
                    price: '',
                    type: 'can'
                });
                setShowForm(true);
            };

            const closeForm = () => {
                setShowForm(false);
            };

            const handleFormChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            const addEntry = async () => {
                const selectedDate = new Date(formData.date + 'T' + new Date().toTimeString().slice(0, 8));
                const newEntry = {
                    id: Date.now(),
                    timestamp: selectedDate.toISOString(),
                    location: formData.location,
                    ounces: formData.ounces !== '' ? parseFloat(formData.ounces) : null,
                    price: formData.price !== '' ? parseFloat(formData.price) : null,
                    type: formData.type
                };
                const newEntries = [newEntry, ...entries];
                await saveEntries(newEntries);
                closeForm();
            };

            const deleteEntry = async (id) => {
                const newEntries = entries.filter(e => e.id !== id);
                await saveEntries(newEntries);
            };

            const getStats = () => {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
                const monthAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
                const yearStart = new Date(now.getFullYear(), 0, 1);

                const calculatePeriodStats = (periodEntries) => {
                    const count = periodEntries.length;
                    const ouncesEntries = periodEntries.filter(e => e.ounces);
                    const totalOunces = ouncesEntries.reduce((sum, e) => sum + e.ounces, 0);
                    const totalCaffeine = totalOunces * 3.83;
                    return { count, totalOunces, totalCaffeine };
                };

                const todayEntries = entries.filter(e => new Date(e.timestamp) >= today);
                const weekEntries = entries.filter(e => new Date(e.timestamp) >= weekAgo);
                const monthEntries = entries.filter(e => new Date(e.timestamp) >= monthAgo);
                const yearEntries = entries.filter(e => new Date(e.timestamp) >= yearStart);

                const todayStats = calculatePeriodStats(todayEntries);
                const weekStatsData = calculatePeriodStats(weekEntries);
                const monthStatsData = calculatePeriodStats(monthEntries);
                const yearStats = calculatePeriodStats(yearEntries);

                const typeBreakdown = entries.reduce((acc, entry) => {
                    if (entry.type) {
                        acc[entry.type] = (acc[entry.type] || 0) + 1;
                    }
                    return acc;
                }, {});

                const priceEntries = entries.filter(e => e.price !== null && e.price !== undefined);
                const totalSpent = priceEntries.reduce((sum, e) => sum + e.price, 0);
                const avgPrice = priceEntries.length > 0 ? totalSpent / priceEntries.length : 0;

                const ouncesEntries = entries.filter(e => e.ounces);
                const totalOunces = ouncesEntries.reduce((sum, e) => sum + e.ounces, 0);
                const avgOunces = ouncesEntries.length > 0 ? totalOunces / ouncesEntries.length : 0;

                const pricePerOunceEntries = entries.filter(e => 
                    (e.price !== null && e.price !== undefined) && e.ounces
                );
                const avgPricePerOunce = pricePerOunceEntries.length > 0 
                    ? pricePerOunceEntries.reduce((sum, e) => sum + (e.price / e.ounces), 0) / pricePerOunceEntries.length 
                    : 0;

                const locationStats = entries.reduce((acc, entry) => {
                    if (entry.location) {
                        if (!acc[entry.location]) {
                            acc[entry.location] = { count: 0, ounces: 0 };
                        }
                        acc[entry.location].count += 1;
                        if (entry.ounces) {
                            acc[entry.location].ounces += entry.ounces;
                        }
                    }
                    return acc;
                }, {});

                const topLocations = Object.entries(locationStats)
                    .map(([location, stats]) => ({
                        location,
                        count: stats.count,
                        ounces: stats.ounces
                    }))
                    .sort((a, b) => {
                        if (b.ounces !== a.ounces) {
                            return b.ounces - a.ounces;
                        }
                        return b.count - a.count;
                    })
                    .slice(0, 10);

                const dayStats = entries.reduce((acc, entry) => {
                    const date = new Date(entry.timestamp);
                    const dateKey = date.toISOString().split('T')[0];
                    
                    if (!acc[dateKey]) {
                        acc[dateKey] = { count: 0, ounces: 0 };
                    }
                    acc[dateKey].count += 1;
                    if (entry.ounces) {
                        acc[dateKey].ounces += entry.ounces;
                    }
                    return acc;
                }, {});

                const topCaffeineDays = Object.entries(dayStats)
                    .map(([date, stats]) => ({
                        date,
                        count: stats.count,
                        ounces: stats.ounces,
                        caffeine: stats.ounces * 3.83
                    }))
                    .filter(day => day.ounces > 0)
                    .sort((a, b) => b.caffeine - a.caffeine)
                    .slice(0, 5);

                const weekStats = entries.reduce((acc, entry) => {
                    const date = new Date(entry.timestamp);
                    const day = date.getDay();
                    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
                    const monday = new Date(date.setDate(diff));
                    const weekKey = monday.toISOString().split('T')[0];
                    
                    if (!acc[weekKey]) {
                        acc[weekKey] = { count: 0, ounces: 0 };
                    }
                    acc[weekKey].count += 1;
                    if (entry.ounces) {
                        acc[weekKey].ounces += entry.ounces;
                    }
                    return acc;
                }, {});

                const topCaffeineWeeks = Object.entries(weekStats)
                    .map(([weekStart, stats]) => ({
                        weekStart,
                        count: stats.count,
                        ounces: stats.ounces,
                        caffeine: stats.ounces * 3.83
                    }))
                    .filter(week => week.ounces > 0)
                    .sort((a, b) => b.caffeine - a.caffeine)
                    .slice(0, 5);

                const monthStats = entries.reduce((acc, entry) => {
                    const date = new Date(entry.timestamp);
                    const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                    
                    if (!acc[monthKey]) {
                        acc[monthKey] = { count: 0, ounces: 0 };
                    }
                    acc[monthKey].count += 1;
                    if (entry.ounces) {
                        acc[monthKey].ounces += entry.ounces;
                    }
                    return acc;
                }, {});

                const topCaffeineMonths = Object.entries(monthStats)
                    .map(([month, stats]) => ({
                        month,
                        count: stats.count,
                        ounces: stats.ounces,
                        caffeine: stats.ounces * 3.83
                    }))
                    .filter(month => month.ounces > 0)
                    .sort((a, b) => b.caffeine - a.caffeine)
                    .slice(0, 5);

                const sortedEntries = [...entries].sort((a, b) => 
                    new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime()
                );
                
                const firstEntryDate = sortedEntries.length > 0 ? new Date(sortedEntries[0].timestamp) : new Date();
                const currentDate = new Date();
                const daysSinceFirst = Math.max(1, Math.ceil((currentDate - firstEntryDate) / (1000 * 60 * 60 * 24)));
                const weeksSinceFirst = Math.max(1, daysSinceFirst / 7);
                const monthsSinceFirst = Math.max(1, daysSinceFirst / 30.44);
                const yearsSinceFirst = Math.max(1, daysSinceFirst / 365.25);

                const totalEntriesWithPrice = entries.filter(e => e.price !== null && e.price !== undefined);
                const totalPriceSpent = totalEntriesWithPrice.reduce((sum, e) => sum + e.price, 0);
                const totalEntriesWithOunces = entries.filter(e => e.ounces);
                const totalOuncesConsumed = totalEntriesWithOunces.reduce((sum, e) => sum + e.ounces, 0);
                const totalCaffeineConsumed = totalOuncesConsumed * 3.83;

                const averages = {
                    perDay: {
                        price: totalPriceSpent / daysSinceFirst,
                        ounces: totalOuncesConsumed / daysSinceFirst,
                        caffeine: totalCaffeineConsumed / daysSinceFirst
                    },
                    perWeek: {
                        price: totalPriceSpent / weeksSinceFirst,
                        ounces: totalOuncesConsumed / weeksSinceFirst,
                        caffeine: totalCaffeineConsumed / weeksSinceFirst
                    },
                    perMonth: {
                        price: totalPriceSpent / monthsSinceFirst,
                        ounces: totalOuncesConsumed / monthsSinceFirst,
                        caffeine: totalCaffeineConsumed / monthsSinceFirst
                    },
                    perYear: {
                        price: totalPriceSpent / yearsSinceFirst,
                        ounces: totalOuncesConsumed / yearsSinceFirst,
                        caffeine: totalCaffeineConsumed / yearsSinceFirst
                    }
                };

                return { 
                    todayStats,
                    weekStatsData,
                    monthStatsData,
                    yearStats,
                    totalCount: entries.length,
                    typeBreakdown,
                    totalSpent,
                    avgPrice,
                    totalOunces,
                    avgOunces,
                    avgPricePerOunce,
                    topLocations,
                    topCaffeineDays,
                    topCaffeineWeeks,
                    topCaffeineMonths,
                    averages
                };
            };

            const formatTime = (timestamp) => {
                return new Date(timestamp).toLocaleTimeString('en-US', { 
                    hour: 'numeric', 
                    minute: '2-digit',
                    hour12: true 
                });
            };

            const formatDate = (timestamp) => {
                const date = new Date(timestamp);
                const today = new Date();
                const yesterday = new Date(today.getTime() - 24 * 60 * 60 * 1000);
                
                if (date.toDateString() === today.toDateString()) {
                    return 'Today';
                } else if (date.toDateString() === yesterday.toDateString()) {
                    return 'Yesterday';
                } else {
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                }
            };

            const formatFullDate = (dateString) => {
                const date = new Date(dateString + 'T00:00:00');
                const today = new Date();
                const yesterday = new Date(today.getTime() - 24 * 60 * 60 * 1000);
                
                const dateOnly = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const yesterdayOnly = new Date(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate());
                
                if (dateOnly.getTime() === todayOnly.getTime()) {
                    return 'Today';
                } else if (dateOnly.getTime() === yesterdayOnly.getTime()) {
                    return 'Yesterday';
                } else {
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                }
            };

            const formatWeek = (weekStartString) => {
                const weekStart = new Date(weekStartString + 'T00:00:00');
                const weekEnd = new Date(weekStart.getTime() + 6 * 24 * 60 * 60 * 1000);
                
                const startMonth = weekStart.toLocaleDateString('en-US', { month: 'short' });
                const startDay = weekStart.getDate();
                const endMonth = weekEnd.toLocaleDateString('en-US', { month: 'short' });
                const endDay = weekEnd.getDate();
                const year = weekStart.getFullYear();
                
                if (startMonth === endMonth) {
                    return `${startMonth} ${startDay}-${endDay}, ${year}`;
                } else {
                    return `${startMonth} ${startDay} - ${endMonth} ${endDay}, ${year}`;
                }
            };

            const formatMonth = (monthString) => {
                const [year, month] = monthString.split('-');
                const date = new Date(parseInt(year), parseInt(month) - 1, 1);
                return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-200 to-gray-300 flex items-center justify-center">
                        <div className="text-red-600 text-xl">Loading...</div>
                    </div>
                );
            }

            const stats = getStats();

            const filteredEntries = entries.filter(e => {
                const entryDate = new Date(e.timestamp);
                const today = new Date();
                const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                
                if (view === 'today') {
                    return entryDate >= todayStart;
                } else if (view === 'week') {
                    const weekAgo = new Date(todayStart.getTime() - 7 * 24 * 60 * 60 * 1000);
                    return entryDate >= weekAgo;
                }
                return true;
            });

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-200 to-gray-300 pb-20">
                    <div className="bg-red-600 text-white p-6 rounded-b-3xl shadow-lg mb-6">
                        <h1 className="text-3xl font-bold mb-2">Diet Coke Tracker</h1>
                        <p className="text-red-100 text-sm">Track your daily consumption</p>
                    </div>

                    <div className="px-6">
                        <button
                            onClick={openForm}
                            className="w-full bg-white rounded-2xl shadow-xl p-6 flex items-center justify-center gap-3 hover:bg-red-50 transition-colors active:scale-95"
                        >
                            <PlusCircle className="w-8 h-8 text-red-600" />
                            <span className="text-xl font-semibold text-red-600">Log a Diet Coke</span>
                        </button>
                    </div>

                    <div className="px-6 mt-6 grid grid-cols-2 gap-4">
                        <div className="bg-white rounded-xl p-4 shadow">
                            <div className="text-gray-500 text-sm mb-2">Today</div>
                            <div className="text-3xl font-bold text-red-600 mb-2">{stats.todayStats.count}</div>
                            {stats.todayStats.totalOunces > 0 && (
                                <div className="space-y-0.5">
                                    <div className="text-xs text-blue-600 font-medium">{stats.todayStats.totalOunces.toFixed(1)} oz</div>
                                    <div className="text-xs text-purple-600 font-medium">{stats.todayStats.totalCaffeine.toFixed(0)} mg caffeine</div>
                                </div>
                            )}
                        </div>

                        <div className="bg-white rounded-xl p-4 shadow">
                            <div className="text-gray-500 text-sm mb-2">This Week</div>
                            <div className="text-3xl font-bold text-red-600 mb-2">{stats.weekStatsData.count}</div>
                            {stats.weekStatsData.totalOunces > 0 && (
                                <div className="space-y-0.5">
                                    <div className="text-xs text-blue-600 font-medium">{stats.weekStatsData.totalOunces.toFixed(1)} oz</div>
                                    <div className="text-xs text-purple-600 font-medium">{stats.weekStatsData.totalCaffeine.toFixed(0)} mg caffeine</div>
                                </div>
                            )}
                        </div>

                        <div className="bg-white rounded-xl p-4 shadow">
                            <div className="text-gray-500 text-sm mb-2">This Month</div>
                            <div className="text-3xl font-bold text-red-600 mb-2">{stats.monthStatsData.count}</div>
                            {stats.monthStatsData.totalOunces > 0 && (
                                <div className="space-y-0.5">
                                    <div className="text-xs text-blue-600 font-medium">{stats.monthStatsData.totalOunces.toFixed(1)} oz</div>
                                    <div className="text-xs text-purple-600 font-medium">{stats.monthStatsData.totalCaffeine.toFixed(0)} mg caffeine</div>
                                </div>
                            )}
                        </div>

                        <div className="bg-white rounded-xl p-4 shadow">
                            <div className="text-gray-500 text-sm mb-2">This Year</div>
                            <div className="text-3xl font-bold text-red-600 mb-2">{stats.yearStats.count}</div>
                            {stats.yearStats.totalOunces > 0 && (
                                <div className="space-y-0.5">
                                    <div className="text-xs text-blue-600 font-medium">{stats.yearStats.totalOunces.toFixed(1)} oz</div>
                                    <div className="text-xs text-purple-600 font-medium">{stats.yearStats.totalCaffeine.toFixed(0)} mg caffeine</div>
                                </div>
                            )}
                        </div>

                        <div className="bg-white rounded-xl p-4 shadow col-span-2">
                            <div className="text-gray-500 text-sm mb-2">All Time</div>
                            <div className="flex items-center justify-between">
                                <div className="text-3xl font-bold text-red-600">{stats.totalCount}</div>
                                {stats.totalOunces > 0 && (
                                    <div className="text-right">
                                        <div className="text-sm text-blue-600 font-medium">{stats.totalOunces.toFixed(1)} oz</div>
                                        <div className="text-sm text-purple-600 font-medium">{(stats.totalOunces * 3.83).toFixed(0)} mg caffeine</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="px-6 mt-6 space-y-4">
                        {entries.length > 0 && (
                            <div className="bg-white rounded-xl p-4 shadow">
                                <h3 className="font-semibold text-gray-800 mb-3">Averages</h3>
                                <div className="space-y-3">
                                    <div className="border-b border-gray-100 pb-2">
                                        <div className="text-sm font-medium text-gray-600 mb-1">Per Day</div>
                                        <div className="grid grid-cols-3 gap-2 text-xs">
                                            {stats.averages.perDay.price > 0 && (
                                                <div className="text-center">
                                                    <div className="text-green-600 font-bold">${stats.averages.perDay.price.toFixed(2)}</div>
                                                    <div className="text-gray-400">cost</div>
                                                </div>
                                            )}
                                            {stats.averages.perDay.ounces > 0 && (
                                                <div className="text-center">
                                                    <div className="text-blue-600 font-bold">{stats.averages.perDay.ounces.toFixed(1)} oz</div>
                                                    <div className="text-gray-400">ounces</div>
                                                </div>
                                            )}
                                            {stats.averages.perDay.caffeine > 0 && (
                                                <div className="text-center">
                                                    <div className="text-purple-600 font-bold">{stats.averages.perDay.caffeine.toFixed(0)} mg</div>
                                                    <div className="text-gray-400">caffeine</div>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="border-b border-gray-100 pb-2">
                                        <div className="text-sm font-medium text-gray-600 mb-1">Per Week</div>
                                        <div className="grid grid-cols-3 gap-2 text-xs">
                                            {stats.averages.perWeek.price > 0 && (
                                                <div className="text-center">
                                                    <div className="text-green-600 font-bold">${stats.averages.perWeek.price.toFixed(2)}</div>
                                                    <div className="text-gray-400">cost</div>
                                                </div>
                                            )}
                                            {stats.averages.perWeek.ounces > 0 && (
                                                <div className="text-center">
                                                    <div className="text-blue-600 font-bold">{stats.averages.perWeek.ounces.toFixed(1)} oz</div>
                                                    <div className="text-gray-400">ounces</div>
                                                </div>
                                            )}
                                            {stats.averages.perWeek.caffeine > 0 && (
                                                <div className="text-center">
                                                    <div className="text-purple-600 font-bold">{stats.averages.perWeek.caffeine.toFixed(0)} mg</div>
                                                    <div className="text-gray-400">caffeine</div>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="border-b border-gray-100 pb-2">
                                        <div className="text-sm font-medium text-gray-600 mb-1">Per Month</div>
                                        <div className="grid grid-cols-3 gap-2 text-xs">
                                            {stats.averages.perMonth.price > 0 && (
                                                <div className="text-center">
                                                    <div className="text-green-600 font-bold">${stats.averages.perMonth.price.toFixed(2)}</div>
                                                    <div className="text-gray-400">cost</div>
                                                </div>
                                            )}
                                            {stats.averages.perMonth.ounces > 0 && (
                                                <div className="text-center">
                                                    <div className="text-blue-600 font-bold">{stats.averages.perMonth.ounces.toFixed(1)} oz</div>
                                                    <div className="text-gray-400">ounces</div>
                                                </div>
                                            )}
                                            {stats.averages.perMonth.caffeine > 0 && (
                                                <div className="text-center">
                                                    <div className="text-purple-600 font-bold">{stats.averages.perMonth.caffeine.toFixed(0)} mg</div>
                                                    <div className="text-gray-400">caffeine</div>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="text-sm font-medium text-gray-600 mb-1">Per Year</div>
                                        <div className="grid grid-cols-3 gap-2 text-xs">
                                            {stats.averages.perYear.price > 0 && (
                                                <div className="text-center">
                                                    <div className="text-green-600 font-bold">${stats.averages.perYear.price.toFixed(2)}</div>
                                                    <div className="text-gray-400">cost</div>
                                                </div>
                                            )}
                                            {stats.averages.perYear.ounces > 0 && (
                                                <div className="text-center">
                                                    <div className="text-blue-600 font-bold">{stats.averages.perYear.ounces.toFixed(1)} oz</div>
                                                    <div className="text-gray-400">ounces</div>
                                                </div>
                                            )}
                                            {stats.averages.perYear.caffeine > 0 && (
                                                <div className="text-center">
                                                    <div className="text-purple-600 font-bold">{stats.averages.perYear.caffeine.toFixed(0)} mg</div>
                                                    <div className="text-gray-400">caffeine</div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {Object.keys(stats.typeBreakdown).length > 0 && (
                            <div className="bg-white rounded-xl p-4 shadow">
                                <h3 className="font-semibold text-gray-800 mb-3">Type</h3>
                                
                                <div className="mb-4 flex items-center justify-center">
                                    <svg width="160" height="160" viewBox="0 0 160 160" className="transform -rotate-90">
                                        {(() => {
                                            const total = Object.values(stats.typeBreakdown).reduce((sum, count) => sum + count, 0);
                                            const colors = {
                                                can: '#ef4444',
                                                bottle: '#3b82f6',
                                                fountain: '#10b981',
                                                freestyle: '#a855f7'
                                            };
                                            
                                            let currentAngle = 0;
                                            const radius = 70;
                                            const centerX = 80;
                                            const centerY = 80;
                                            
                                            return Object.entries(stats.typeBreakdown)
                                                .sort((a, b) => b[1] - a[1])
                                                .map(([type, count]) => {
                                                    const percentage = count / total;
                                                    const angle = percentage * 360;
                                                    
                                                    const startAngle = (currentAngle * Math.PI) / 180;
                                                    const endAngle = ((currentAngle + angle) * Math.PI) / 180;
                                                    
                                                    const x1 = centerX + radius * Math.cos(startAngle);
                                                    const y1 = centerY + radius * Math.sin(startAngle);
                                                    const x2 = centerX + radius * Math.cos(endAngle);
                                                    const y2 = centerY + radius * Math.sin(endAngle);
                                                    
                                                    const largeArcFlag = angle > 180 ? 1 : 0;
                                                    
                                                    const pathData = [
                                                        `M ${centerX} ${centerY}`,
                                                        `L ${x1} ${y1}`,
                                                        `A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2}`,
                                                        'Z'
                                                    ].join(' ');
                                                    
                                                    currentAngle += angle;
                                                    
                                                    return (
                                                        <path
                                                            key={type}
                                                            d={pathData}
                                                            fill={colors[type] || '#6b7280'}
                                                            stroke="white"
                                                            strokeWidth="2"
                                                        />
                                                    );
                                                });
                                        })()}
                                    </svg>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    {Object.entries(stats.typeBreakdown)
                                        .sort((a, b) => b[1] - a[1])
                                        .map(([type, count]) => {
                                            const colors = {
                                                can: 'bg-red-500',
                                                bottle: 'bg-blue-500',
                                                fountain: 'bg-green-500',
                                                freestyle: 'bg-purple-500'
                                            };
                                            return (
                                                <div key={type} className="flex items-center justify-between bg-gray-50 rounded-lg p-2">
                                                    <div className="flex items-center gap-2">
                                                        <div className={`w-3 h-3 rounded-full ${colors[type] || 'bg-gray-500'}`}></div>
                                                        <span className="capitalize text-gray-700 text-sm">{type}</span>
                                                    </div>
                                                    <span className="font-bold text-red-600">{count}</span>
                                                </div>
                                            );
                                        })}
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-2 gap-4">
                            {stats.totalSpent !== null && entries.some(e => e.price !== null && e.price !== undefined) && (
                                <div className="bg-white rounded-xl p-4 shadow">
                                    <div className="text-gray-500 text-sm mb-1">Total Spent</div>
                                    <div className="text-2xl font-bold text-green-600">${stats.totalSpent.toFixed(2)}</div>
                                    <div className="text-xs text-gray-400 mt-1">Avg: ${stats.avgPrice.toFixed(2)}</div>
                                </div>
                            )}
                            {stats.totalOunces > 0 && (
                                <div className="bg-white rounded-xl p-4 shadow">
                                    <div className="text-gray-500 text-sm mb-1">Total Ounces</div>
                                    <div className="text-2xl font-bold text-blue-600">{stats.totalOunces.toFixed(1)}</div>
                                    <div className="text-xs text-gray-400 mt-1">Avg: {stats.avgOunces.toFixed(1)} oz</div>
                                </div>
                            )}
                            {stats.avgPricePerOunce > 0 && (
                                <div className="bg-white rounded-xl p-4 shadow col-span-2">
                                    <div className="text-gray-500 text-sm mb-1">Price per Ounce</div>
                                    <div className="text-2xl font-bold text-purple-600">${stats.avgPricePerOunce.toFixed(3)}/oz</div>
                                    <div className="text-xs text-gray-400 mt-1">Average across all entries</div>
                                </div>
                            )}
                        </div>

                        {stats.topCaffeineDays.length > 0 && (
                            <div className="bg-white rounded-xl p-4 shadow">
                                <h3 className="font-semibold text-gray-800 mb-3">Most Caffeinated Days</h3>
                                <div className="space-y-2">
                                    {stats.topCaffeineDays.map((day, index) => (
                                        <div key={day.date} className="flex items-center gap-3 p-2 bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg">
                                            <div className="flex-shrink-0 w-6 text-center font-bold text-purple-400 text-sm">
                                                #{index + 1}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-medium text-gray-800">{formatFullDate(day.date)}</div>
                                                <div className="text-xs text-gray-500">
                                                    {day.count} {day.count === 1 ? 'drink' : 'drinks'} • {day.ounces.toFixed(1)} oz
                                                </div>
                                            </div>
                                            <div className="flex-shrink-0 text-right">
                                                <div className="text-lg font-bold text-purple-600">{day.caffeine.toFixed(0)}</div>
                                                <div className="text-xs text-purple-500 font-semibold">mg</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {stats.topLocations.length > 0 && (
                            <div className="bg-white rounded-xl p-4 shadow">
                                <h3 className="font-semibold text-gray-800 mb-3">Top Locations</h3>
                                <div className="space-y-2">
                                    {stats.topLocations.map((loc, index) => (
                                        <div key={loc.location} className="flex items-center gap-3 p-2 bg-gray-50 rounded-lg">
                                            <div className="flex-shrink-0 w-6 text-center font-bold text-gray-400 text-sm">
                                                #{index + 1}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-medium text-gray-800 truncate">{loc.location}</div>
                                                <div className="text-xs text-gray-500">
                                                    {loc.count} {loc.count === 1 ? 'entry' : 'entries'}
                                                    {loc.ounces > 0 && ` • ${loc.ounces.toFixed(1)} oz`}
                                                </div>
                                            </div>
                                            <div className="flex-shrink-0 text-right">
                                                <div className="text-lg font-bold text-red-600">{loc.count}</div>
                                                {loc.ounces > 0 && (
                                                    <div className="text-xs text-blue-600 font-semibold">{loc.ounces.toFixed(0)} oz</div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="px-6 mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                        {stats.topCaffeineWeeks.length > 0 && (
                            <div className="bg-white rounded-xl p-4 shadow">
                                <h3 className="font-semibold text-gray-800 mb-3">Most Caffeinated Weeks</h3>
                                <div className="space-y-2">
                                    {stats.topCaffeineWeeks.map((week, index) => (
                                        <div key={week.weekStart} className="flex items-center gap-3 p-2 bg-gradient-to-r from-orange-50 to-red-50 rounded-lg">
                                            <div className="flex-shrink-0 w-6 text-center font-bold text-orange-400 text-sm">
                                                #{index + 1}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-medium text-gray-800 text-sm">{formatWeek(week.weekStart)}</div>
                                                <div className="text-xs text-gray-500">
                                                    {week.count} {week.count === 1 ? 'drink' : 'drinks'} • {week.ounces.toFixed(1)} oz
                                                </div>
                                            </div>
                                            <div className="flex-shrink-0 text-right">
                                                <div className="text-lg font-bold text-orange-600">{week.caffeine.toFixed(0)}</div>
                                                <div className="text-xs text-orange-500 font-semibold">mg</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {stats.topCaffeineMonths.length > 0 && (
                            <div className="bg-white rounded-xl p-4 shadow">
                                <h3 className="font-semibold text-gray-800 mb-3">Most Caffeinated Months</h3>
                                <div className="space-y-2">
                                    {stats.topCaffeineMonths.map((month, index) => (
                                        <div key={month.month} className="flex items-center gap-3 p-2 bg-gradient-to-r from-cyan-50 to-blue-50 rounded-lg">
                                            <div className="flex-shrink-0 w-6 text-center font-bold text-cyan-400 text-sm">
                                                #{index + 1}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-medium text-gray-800 text-sm">{formatMonth(month.month)}</div>
                                                <div className="text-xs text-gray-500">
                                                    {month.count} {month.count === 1 ? 'drink' : 'drinks'} • {month.ounces.toFixed(1)} oz
                                                </div>
                                            </div>
                                            <div className="flex-shrink-0 text-right">
                                                <div className="text-lg font-bold text-cyan-600">{month.caffeine.toFixed(0)}</div>
                                                <div className="text-xs text-cyan-500 font-semibold">mg</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="px-6 mt-6">
                        <div className="bg-white rounded-xl p-1 shadow flex gap-1">
                            <button
                                onClick={() => setView('today')}
                                className={`flex-1 py-2 px-4 rounded-lg font-medium text-sm transition-colors ${
                                    view === 'today' ? 'bg-red-600 text-white' : 'text-gray-600 hover:bg-gray-100'
                                }`}
                            >
                                Today
                            </button>
                            <button
                                onClick={() => setView('week')}
                                className={`flex-1 py-2 px-4 rounded-lg font-medium text-sm transition-colors ${
                                    view === 'week' ? 'bg-red-600 text-white' : 'text-gray-600 hover:bg-gray-100'
                                }`}
                            >
                                Week
                            </button>
                            <button
                                onClick={() => setView('all')}
                                className={`flex-1 py-2 px-4 rounded-lg font-medium text-sm transition-colors ${
                                    view === 'all' ? 'bg-red-600 text-white' : 'text-gray-600 hover:bg-gray-100'
                                }`}
                            >
                                All
                            </button>
                        </div>
                    </div>

                    <div className="px-6 mt-6">
                        <div className="bg-white rounded-xl shadow overflow-hidden">
                            <div className="p-4 border-b border-gray-100 flex items-center gap-2">
                                <Calendar className="w-5 h-5 text-red-600" />
                                <h2 className="font-semibold text-gray-800">History</h2>
                                <span className="text-sm text-gray-500 ml-auto">{filteredEntries.length} entries</span>
                            </div>
                            
                            {filteredEntries.length === 0 ? (
                                <div className="p-8 text-center text-gray-500">
                                    No entries yet. Log your first Diet Coke!
                                </div>
                            ) : (
                                <div className="divide-y divide-gray-100 max-h-96 overflow-y-auto">
                                    {filteredEntries.map((entry) => (
                                        <div key={entry.id} className="p-4 hover:bg-gray-50">
                                            <div className="flex items-start justify-between">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="font-medium text-gray-800">{formatDate(entry.timestamp)}</span>
                                                        <span className="text-sm text-gray-500">{formatTime(entry.timestamp)}</span>
                                                    </div>
                                                    <div className="flex flex-wrap gap-2 text-sm">
                                                        {entry.type && (
                                                            <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded-full capitalize">
                                                                {entry.type}
                                                            </span>
                                                        )}
                                                        {entry.ounces && (
                                                            <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">
                                                                {entry.ounces} oz
                                                            </span>
                                                        )}
                                                        {entry.price !== null && entry.price !== undefined && (
                                                            <span className="bg-green-100 text-green-700 px-2 py-0.5 rounded-full">
                                                                ${entry.price.toFixed(2)}
                                                            </span>
                                                        )}
                                                    </div>
                                                    {entry.location && (
                                                        <div className="text-sm text-gray-600 mt-1">📍 {entry.location}</div>
                                                    )}
                                                </div>
                                                <button
                                                    onClick={() => deleteEntry(entry.id)}
                                                    className="text-red-500 hover:text-red-700 p-2 hover:bg-red-50 rounded-lg transition-colors ml-2"
                                                >
                                                    <Trash2 className="w-5 h-5" />
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {stats.totalCount >= 50 && (
                        <div className="px-6 mt-6">
                            <div className="bg-gradient-to-r from-yellow-400 to-orange-400 rounded-xl p-4 shadow-lg text-white">
                                <div className="flex items-center gap-3">
                                    <Award className="w-8 h-8" />
                                    <div>
                                        <div className="font-bold text-lg">Achievement Unlocked!</div>
                                        <div className="text-sm opacity-90">50+ Diet Cokes tracked</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showForm && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-end justify-center z-50">
                            <div className="bg-white w-full max-w-lg rounded-t-3xl p-6 pb-8 animate-slide-up">
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Log Diet Coke</h2>
                                    <button
                                        onClick={closeForm}
                                        className="text-gray-400 hover:text-gray-600 text-2xl leading-none"
                                    >
                                        ×
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Date
                                        </label>
                                        <input
                                            type="date"
                                            value={formData.date}
                                            onChange={(e) => handleFormChange('date', e.target.value)}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Type
                                        </label>
                                        <select
                                            value={formData.type}
                                            onChange={(e) => handleFormChange('type', e.target.value)}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                        >
                                            <option value="can">Can</option>
                                            <option value="bottle">Bottle</option>
                                            <option value="fountain">Fountain</option>
                                            <option value="freestyle">Freestyle</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Ounces (optional)
                                        </label>
                                        <input
                                            type="number"
                                            step="0.1"
                                            placeholder="e.g., 12, 20, 32"
                                            value={formData.ounces}
                                            onChange={(e) => handleFormChange('ounces', e.target.value)}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Price (optional)
                                        </label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            placeholder="e.g., 1.99"
                                            value={formData.price}
                                            onChange={(e) => handleFormChange('price', e.target.value)}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Location (optional)
                                        </label>
                                        <input
                                            type="text"
                                            placeholder="e.g., Home, Office, McDonald's"
                                            value={formData.location}
                                            onChange={(e) => handleFormChange('location', e.target.value)}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                        />
                                    </div>
                                </div>

                                <div className="flex gap-3 mt-6">
                                    <button
                                        onClick={closeForm}
                                        className="flex-1 py-3 px-4 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition-colors"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={addEntry}
                                        className="flex-1 py-3 px-4 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 transition-colors"
                                    >
                                        Save
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DietCokeTracker />);
    </script>
</body>
</html>
